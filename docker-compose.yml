version: '3.7'

x-environment: &global-environment
  DOCKER_INFLUXDB_INIT_USERNAME: admin
  DOCKER_INFLUXDB_INIT_PASSWORD: supersecret
  DOCKER_INFLUXDB_INIT_ORG: myorg
  DOCKER_INFLUXDB_INIT_BUCKET: mybucket
  DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: 83A24B9B-BBF6-4A19-B9F5-5806D4BA8FBD

services:
  master-node:
    build:
      context: .
      dockerfile: master-node/Dockerfile
    depends_on:
      - influxdb
    environment:
      <<: *global-environment

  influxdb:
    image: influxdb:2.7
    volumes:
      - influxdb-data:/var/lib/influxdb
    environment:
      <<: *global-environment
      DOCKER_INFLUXDB_INIT_MODE: setup
      TZ: Etc/UTC
    ports:
      - "8086:8086"

  mosquitto:
    image: eclipse-mosquitto:2.0
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
      - mosquitto-log:/mosquitto/log
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  grafana:
    image: grafana/grafana:11.0.0
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana-provisioning/datasources:/etc/grafana/provisioning/datasources
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - influxdb
    ports:
      - "80:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin  # Change 'grafanapass' to your preferred password
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_API_KEY: "p7hV9Z2X!kL3zNfB6QkM1cD4xS2jH8rG"

  ntp:
    image: cturra/ntp
    restart: always
    ports:
      - "123:123/udp"

  # ===========================================
  # GRAYLOG - Centralized Logging (Optional)
  # ===========================================
  # Uncomment this section to enable centralized logging from all nodes.
  # Access Graylog UI at http://localhost:9000
  # Default login: admin / graylog-password
  #
  # After starting, you must create a GELF UDP input:
  # 1. Go to System > Inputs
  # 2. Select "GELF UDP" from dropdown
  # 3. Click "Launch new input"
  # 4. Set port to 12201, click Save

  graylog:
    image: graylog/graylog:5.2
    volumes:
      - graylog-data:/usr/share/graylog/data
    ports:
      - "9000:9000"        # Web UI
      - "12201:12201/udp"  # GELF UDP input (for remote nodes)
      - "12201:12201/tcp"  # GELF TCP input (backup)
    environment:
      # CHANGE THIS: Must be at least 16 characters
      GRAYLOG_PASSWORD_SECRET: "basssentry16chars!"
      # Password: "graylog-password" - generate new: echo -n yourpassword | sha256sum
      GRAYLOG_ROOT_PASSWORD_SHA2: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
      GRAYLOG_HTTP_EXTERNAL_URI: "http://localhost:9000/"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch:9200"
      GRAYLOG_MONGODB_URI: "mongodb://mongo:27017/graylog"
    depends_on:
      - mongo
      - opensearch
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
  mosquitto-data:
  mosquitto-log:
  graylog-data:
  mongo-data:
  opensearch-data:
