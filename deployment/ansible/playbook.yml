---
# Bass Sentry Fleet Deployment Playbook
#
# Usage:
#   Deploy to all nodes:
#     ansible-playbook -i inventory.local.yml playbook.yml
#
#   Deploy to specific node:
#     ansible-playbook -i inventory.local.yml playbook.yml --limit dance-floor
#
#   Only update code (skip setup):
#     ansible-playbook -i inventory.local.yml playbook.yml --tags update
#
#   Only restart service:
#     ansible-playbook -i inventory.local.yml playbook.yml --tags restart

- name: Deploy Bass Sentry to remote nodes
  hosts: reference_nodes:remote_nodes
  become: yes
  vars:
    install_dir: "{{ install_dir | default('/home/bass/bass-sentry') }}"
    venv_dir: "{{ venv_dir | default('/home/bass/bass-sentry/venv') }}"
    bass_user: "{{ bass_user | default('bass') }}"

  tasks:
    # === SETUP TASKS ===
    - name: Install system dependencies
      apt:
        name:
          - git
          - python3-venv
          - python3-pip
          - portaudio19-dev
          - libsndfile1
          - libatlas-base-dev
        state: present
        update_cache: yes
      tags: [setup, never]

    - name: Create bass user
      user:
        name: "{{ bass_user }}"
        groups: audio,video,plugdev
        shell: /bin/bash
        create_home: yes
      tags: [setup, never]

    - name: Ensure install directory exists
      file:
        path: "{{ install_dir }}"
        state: directory
        owner: "{{ bass_user }}"
        group: "{{ bass_user }}"
        mode: '0755'
      tags: [setup, update]

    # === UPDATE TASKS ===
    - name: Clone or update repository
      git:
        repo: "{{ bass_sentry_repo }}"
        dest: "{{ install_dir }}"
        version: "{{ bass_sentry_branch | default('master') }}"
        force: yes
      become_user: "{{ bass_user }}"
      tags: [update]

    - name: Create Python virtual environment
      command: python3 -m venv {{ venv_dir }}
      args:
        creates: "{{ venv_dir }}/bin/python"
      become_user: "{{ bass_user }}"
      tags: [update]

    - name: Install Python dependencies
      pip:
        requirements: "{{ install_dir }}/requirements.txt"
        virtualenv: "{{ venv_dir }}"
        state: present
      become_user: "{{ bass_user }}"
      tags: [update]

    - name: Copy DAG file
      copy:
        src: "dag_files/{{ dag_file }}"
        dest: "{{ install_dir }}/remote-node/dag_files/{{ dag_file }}"
        owner: "{{ bass_user }}"
        group: "{{ bass_user }}"
        mode: '0644'
      when: dag_file is defined
      tags: [update, config]
      notify: Restart bass sentry service

    - name: Create node configuration
      template:
        src: templates/node_config.json.j2
        dest: "{{ install_dir }}/remote-node/config/node.json"
        owner: "{{ bass_user }}"
        group: "{{ bass_user }}"
        mode: '0644'
      tags: [update, config]
      notify: Restart bass sentry service

    # === SERVICE TASKS ===
    - name: Install systemd service
      template:
        src: templates/bass_sentry_node.service.j2
        dest: /etc/systemd/system/{{ service_name }}.service
        owner: root
        group: root
        mode: '0644'
      tags: [service]
      notify:
        - Reload systemd
        - Restart bass sentry service

    - name: Enable and start service
      systemd:
        name: "{{ service_name }}"
        enabled: yes
        state: started
      tags: [service]

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: yes

    - name: Restart bass sentry service
      systemd:
        name: "{{ service_name }}"
        state: restarted


- name: Deploy Bass Sentry master node
  hosts: master_nodes
  become: yes
  vars:
    install_dir: "{{ install_dir | default('/home/bass/bass-sentry') }}"
    bass_user: "{{ bass_user | default('bass') }}"

  tasks:
    - name: Install Docker dependencies
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: yes
      when: use_docker | default(false)
      tags: [setup, never]

    - name: Clone or update repository
      git:
        repo: "{{ bass_sentry_repo }}"
        dest: "{{ install_dir }}"
        version: "{{ bass_sentry_branch | default('master') }}"
        force: yes
      become_user: "{{ bass_user }}"
      tags: [update]

    - name: Start Docker services
      command: docker-compose up -d
      args:
        chdir: "{{ install_dir }}"
      when: use_docker | default(false)
      tags: [update, restart]
